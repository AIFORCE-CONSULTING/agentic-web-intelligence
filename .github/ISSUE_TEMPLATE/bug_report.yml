name: Bug report
description: Report a reproducible defect in the platform or documentation.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, personal data, customer data, or security-sensitive details. See SECURITY.md for vulnerability reporting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit, image tag, or environment
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove secrets and sensitive data before attaching evidence.
