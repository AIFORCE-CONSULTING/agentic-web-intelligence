name: Continuous integration

on:
  push:
    branches: ["**"]
  pull_request:

# Each job receives only repository read access. The workflow never runs with
# pull_request_target, so code from a fork cannot access repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0

      - name: Audit API lockfile
        run: pip-audit -r apps/api/requirements.lock

      - name: Audit documentation lockfile
        run: pip-audit -r docs/requirements.lock

  api:
    name: API quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify source and lockfile alignment
        run: python scripts/check_python_lock_consistency.py

      - name: Install hash-locked development dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements-dev.lock"

      - name: Lint
        working-directory: apps/api
        run: ruff check .

      - name: Test
        working-directory: apps/api
        run: PYTHONPATH=. pytest

  web:
    name: Web quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        working-directory: apps/web
        run: npm ci --ignore-scripts --audit=false

      # esbuild needs its platform-specific binary. This is the only approved
      # lifecycle script and its output remains visible in the CI log.
      - name: Rebuild reviewed esbuild binary
        working-directory: apps/web
        run: npm rebuild esbuild --ignore-scripts=false --foreground-scripts --audit=false

      - name: Audit dependency lock
        working-directory: apps/web
        run: npm audit --package-lock-only --ignore-scripts

      - name: Build
        working-directory: apps/web
        run: npm run build

  docs:
    name: Documentation quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install hash-locked documentation dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r docs/requirements.lock"

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Parse GitHub configuration YAML
        run: python scripts/validate_github_yaml.py

  container-build:
    name: Container builds
    needs: [api, web, docs]
    runs-on: ubuntu-24.04
    # Compose parses every service during a build, including deferred stateful
    # services. These placeholders are not secrets and those services are not run.
    env:
      POSTGRES_PASSWORD: ci-not-used
      REDIS_PASSWORD: ci-not-used
      SEARXNG_SECRET: ci-not-used
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build application and documentation images
        run: docker compose --profile documentation build api web docs
