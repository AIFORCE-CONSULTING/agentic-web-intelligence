name: agentic-web-intelligence

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-enterprise_agent_platform}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - platform

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - platform

  docs:
    profiles: ["documentation"]
    build:
      context: .
      dockerfile: docker/docs.Dockerfile
    ports:
      - "8001:80"
    networks:
      - platform

  searxng:
    profiles: ["web-research"]
    image: docker.io/searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--proxy=off", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - platform

  postgres:
    profiles: ["stateful-services", "web-research"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_agent_platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform

  redis:
    # Deferred until a concrete cache, rate-limit, or queue capability needs it.
    profiles: ["stateful-services"]
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - platform

networks:
  platform:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  searxng-data:
