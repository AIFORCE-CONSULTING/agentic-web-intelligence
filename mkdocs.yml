site_name: Agentic Web Intelligence
site_description: Production-quality platform for governed web discovery and AI-agent research workflows.
site_url: https://aiforce-consulting.github.io/agentic-web-intelligence
repo_name: AIFORCE-CONSULTING/agentic-web-intelligence

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables

# Mermaid is pinned to an exact release so documentation rendering does not
# drift with a mutable CDN tag. It will be self-hosted before production docs.
extra_javascript:
  - https://unpkg.com/mermaid@11.12.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Foundation:
      - Project vision: foundation/project.md
      - Engineering principles: foundation/principles.md
      - Technology stack: foundation/tech-stack.md
      - Roadmap: foundation/roadmap.md
      - Dependency management: dependency-management.md
  - Architecture:
      - Platform architecture: architecture.md
      - Architecture diagrams: diagrams/index.md
      - Repository organization: repositories.md
      - Decisions (ADRs): decisions.md
      - ADR 0001 — Monorepo: adr/0001-monorepo.md
      - ADR 0002 — React and FastAPI: adr/0002-react-fastapi.md
      - ADR 0003 — Web intelligence via MCP: adr/0003-web-intelligence-mcp.md
      - ADR 0004 — Governed web-research MVP: adr/0004-governed-web-research-mvp.md
      - ADR 0005 — Governed agent-runtime contract: adr/0005-governed-agent-runtime-contract.md
      - ADR 0006 — Local-first identity: adr/0006-local-first-enterprise-ready-identity.md
  - Web research: governed-web-research.md
  - Agent runtime: agent-runtime.md
  - Identity: identity.md
  - Governed research prompt: governed-research-prompt.md
  - Contributing:
      - Contribution guide: contributing.md
      - Style guide: style-guide.md

copyright: Copyright &copy; 2026 Enterprise Agent Platform contributors
