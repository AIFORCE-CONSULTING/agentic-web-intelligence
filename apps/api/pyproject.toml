[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-web-intelligence-api"
version = "0.1.0"
description = "FastAPI gateway and platform API for Agentic Web Intelligence."
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg==0.31.0",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "langgraph==1.2.10",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "trafilatura==2.2.0",
  "uvicorn==0.47.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
